<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root{
    --bg:#ffffff; --fg:#172b4d; --muted:#5e6c84; --rule:#dfe1e6;
    --link:#0052cc; --code-bg:#f4f5f7; --accent:#0052cc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d2125; --fg:#c7d1db; --muted:#9fadbc; --rule:#2c333a;
           --link:#579dff; --code-bg:#22272b; --accent:#579dff; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:40px 24px 80px}
  header.site{border-bottom:1px solid var(--rule); margin-bottom:36px; padding-bottom:18px}
  header.site a.home{color:var(--fg); text-decoration:none; font-weight:700; font-size:17px}
  header.site .tag{color:var(--muted); font-size:13px; margin-top:4px}
  a{color:var(--link)}
  h1{font-size:32px; line-height:1.25; margin:0 0 20px; letter-spacing:-.01em}
  h2{font-size:23px; margin:38px 0 12px; padding-top:6px; border-top:1px solid var(--rule); letter-spacing:-.005em}
  h3{font-size:18px; margin:26px 0 8px}
  h4{font-size:16px; margin:20px 0 6px; color:var(--muted)}
  p,li{margin:0 0 12px}
  ul,ol{padding-left:22px}
  code{background:var(--code-bg); padding:2px 5px; border-radius:3px; font-size:.88em;
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  pre{background:var(--code-bg); padding:14px 16px; border-radius:6px; overflow-x:auto}
  pre code{background:none; padding:0}
  blockquote{margin:16px 0; padding:12px 16px; border-left:3px solid var(--accent);
             background:var(--code-bg); border-radius:0 4px 4px 0}
  blockquote p:last-child{margin-bottom:0}
  table{border-collapse:collapse; width:100%; margin:16px 0; font-size:14px; display:block; overflow-x:auto}
  th,td{border:1px solid var(--rule); padding:8px 10px; text-align:left; vertical-align:top}
  th{background:var(--code-bg); font-weight:600}
  hr{border:0; border-top:1px solid var(--rule); margin:32px 0}
  footer.site{margin-top:56px; padding-top:18px; border-top:1px solid var(--rule);
              color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="home" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <div class="tag">{{ site.description }}</div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    MetaSync for Confluence &middot;
    <a href="{{ site.baseurl }}/privacy">Privacy</a> &middot;
    <a href="{{ site.baseurl }}/terms">Terms</a> &middot;
    <a href="{{ site.baseurl }}/support">SLA</a>
  </footer>
</div>
</body>
</html>
